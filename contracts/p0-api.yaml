openapi: 3.0.3
info:
  title: 异业联盟商城 P0 接口契约
  version: 1.0.0
  description: |
    目标契约（contract-first），覆盖消费者、商户、平台三端与微信回调。
    当前实现见 contracts/openapi.yaml；本文件是开发与联调依据，未实现接口标 x-status: planned。

    通用约定：
    - 金额一律整数「分」，字段以 _amount 结尾。
    - 时间 ISO 8601，带时区（+08:00）。
    - 写接口重复调用必须幂等；创建订单/支付/退款/提现/核销携带 Idempotency-Key。
    - 响应包裹 { code, message, trace_id, data }；业务失败用 code 区分。
    - 分页参数 page / page_size，返回 total / has_more。
    - x-status: implemented 表示接口已存在，但部分响应仍是旧格式（DRF detail），按本契约逐步迁移；planned 表示待实现。
servers:
  - url: http://127.0.0.1:8000
    description: 本地开发
tags:
  - name: auth
    description: 登录与身份
  - name: consumer
    description: 消费者端
  - name: cart
    description: 单店购物车
  - name: order
    description: 订单
  - name: aftersale
    description: 售后
  - name: merchant
    description: 商户端
  - name: admin
    description: 平台后台
  - name: callback
    description: 微信回调
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PageParam:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSizeParam:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 业务幂等键；同键不同请求体返回 IDEMPOTENCY_CONFLICT
      schema: { type: string, maxLength: 64 }
  responses:
    Unauthorized:
      description: 未登录或 Token 失效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: 无权限或跨商户访问
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: 状态冲突或幂等冲突
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ValidationError:
      description: 参数校验失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    ErrorEnvelope:
      type: object
      required: [code, message, trace_id]
      properties:
        code: { type: string, example: ORDER_STATE_CONFLICT }
        message: { type: string }
        trace_id: { type: string }
        details: { type: object, additionalProperties: true }
    Envelope:
      type: object
      required: [code, message, trace_id]
      properties:
        code: { type: string, example: OK }
        message: { type: string, example: success }
        trace_id: { type: string }
    Page:
      type: object
      required: [page, page_size, total, has_more]
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
        has_more: { type: boolean }
    TokenPair:
      type: object
      required: [access, refresh]
      properties:
        access: { type: string }
        refresh: { type: string }
        expires_in: { type: integer, description: access 有效期（秒） }
    TokenEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/TokenPair' }
    WechatLoginInput:
      type: object
      required: [code]
      properties:
        code: { type: string, description: wx.login 的 code }
        channel: { type: string, enum: [WECHAT_MINI, WECHAT_H5], default: WECHAT_MINI }
    SmsLoginInput:
      type: object
      required: [phone, sms_code]
      properties:
        phone: { type: string, example: '13800138000' }
        sms_code: { type: string, minLength: 4, maxLength: 8 }
        union_id: { type: string, description: 微信内 H5 授权后回传 }
    SmsSendInput:
      type: object
      required: [phone, scene]
      properties:
        phone: { type: string }
        scene: { type: string, enum: [LOGIN, ORDER_NOTICE] }
    SmsSendResult:
      type: object
      properties:
        expires_in: { type: integer, description: 验证码有效期（秒） }
        debug_code: { type: string, nullable: true, description: 仅 Mock 模式返回，生产环境为空 }
    SmsSendResultEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/SmsSendResult' }
    Me:
      type: object
      properties:
        id: { type: integer, format: int64 }
        phone: { type: string }
        nickname: { type: string }
        avatar_url: { type: string }
        is_staff: { type: boolean }
        merchant_roles:
          type: array
          items:
            type: object
            properties:
              merchant_id: { type: integer, format: int64 }
              merchant_name: { type: string }
              role: { type: string, enum: [OWNER, MANAGER, CLERK] }
    MeEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Me' }
    AddressInput:
      type: object
      required: [receiver_name, phone, city, district, detail]
      properties:
        receiver_name: { type: string, maxLength: 40 }
        phone: { type: string, maxLength: 20 }
        province: { type: string }
        city: { type: string }
        district: { type: string }
        detail: { type: string, maxLength: 120 }
        lng: { type: number, format: double }
        lat: { type: number, format: double }
        tag: { type: string, enum: [HOME, COMPANY, OTHER] }
        is_default: { type: boolean }
    Address:
      allOf:
        - $ref: '#/components/schemas/AddressInput'
        - type: object
          properties:
            id: { type: integer, format: int64 }
            created_at: { type: string, format: date-time }
    AddressEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Address' }
    AddressListEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Address' }
    Store:
      type: object
      properties:
        id: { type: integer, format: int64 }
        merchant_no: { type: string }
        name: { type: string }
        logo_url: { type: string }
        category_id: { type: integer, format: int64 }
        category_name: { type: string }
        address: { type: string }
        city: { type: string }
        district: { type: string }
        lng: { type: number, format: double }
        lat: { type: number, format: double }
        distance_meters: { type: integer, description: 仅附近接口返回 }
        business_hours: { type: object, additionalProperties: true }
        status: { type: string, enum: [PENDING, ACTIVE, REJECTED, SUSPENDED, CLOSED] }
    StoreEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Store' }
    StorePageEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/Store' }
                page: { $ref: '#/components/schemas/Page' }
    Sku:
      type: object
      properties:
        id: { type: integer, format: int64 }
        sku_code: { type: string }
        spec: { type: object, additionalProperties: true }
        price_amount: { type: integer, description: 售价（分） }
        available_stock: { type: integer }
    ServiceSlot:
      type: object
      properties:
        id: { type: integer, format: int64 }
        slot_date: { type: string, format: date }
        start_time: { type: string, example: '10:00' }
        end_time: { type: string, example: '10:30' }
        capacity: { type: integer }
        remaining: { type: integer }
    Product:
      type: object
      properties:
        id: { type: integer, format: int64 }
        merchant_id: { type: integer, format: int64 }
        merchant_name: { type: string }
        merchant_address: { type: string }
        merchant_phone: { type: string }
        category_id: { type: integer, format: int64 }
        type: { type: string, enum: [PHYSICAL, SERVICE, COUPON] }
        title: { type: string }
        subtitle: { type: string }
        cover_url: { type: string }
        images:
          type: array
          items: { type: string }
        description: { type: string }
        price_amount: { type: integer }
        original_price_amount: { type: integer }
        sold_count: { type: integer }
        verify_days: { type: integer }
        appointment_required: { type: boolean }
        delivery_types:
          type: array
          items: { type: string, enum: [EXPRESS, STORE_DELIVERY, PICKUP, VERIFY, APPOINTMENT] }
        valid_type: { type: string, enum: [DAYS, PERMANENT, RANGE], description: 卡券有效期类型 }
        valid_days: { type: integer, nullable: true, description: 卡券有效天数 }
        valid_from: { type: string, format: date-time, nullable: true }
        valid_to: { type: string, format: date-time, nullable: true }
        usable_weekdays:
          type: array
          description: 可用星期（1=周一，空=不限）
          items: { type: integer, minimum: 1, maximum: 7 }
        exclude_holidays: { type: boolean, description: 法定节假日不可用（仅文案提示，商户人工判断） }
        verify_count: { type: integer, description: 可核销次数 }
        skus:
          type: array
          items: { $ref: '#/components/schemas/Sku' }
        slots:
          type: array
          items: { $ref: '#/components/schemas/ServiceSlot' }
        refund_policy: { type: string, description: P0 展示文本，具体规则 TBD }
    ProductEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Product' }
    ProductPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/Product' }
                page: { $ref: '#/components/schemas/Page' }
    MerchantSku:
      type: object
      properties:
        id: { type: integer, format: int64 }
        sku_code: { type: string }
        spec_json: { type: object, additionalProperties: true }
        price: { type: integer }
        stock: { type: integer }
        available_stock: { type: integer }
    MerchantProduct:
      type: object
      properties:
        id: { type: integer, format: int64 }
        product_code: { type: string, description: 商户货号，商户内唯一，可为空 }
        merchant_category_id: { type: integer, format: int64, nullable: true }
        merchant_category_name: { type: string }
        type: { type: string, enum: [PHYSICAL, SERVICE, COUPON] }
        title: { type: string }
        subtitle: { type: string }
        cover_url: { type: string }
        price: { type: integer }
        status: { type: string, enum: [DRAFT, PENDING_AUDIT, ON_SALE, OFF_SALE, REJECTED] }
        reject_reason: { type: string }
        total_stock: { type: integer }
        sold_count: { type: integer }
        delivery_types:
          type: array
          items: { type: string, enum: [EXPRESS, STORE_DELIVERY, PICKUP, VERIFY, APPOINTMENT] }
        submitted_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time }
        off_sale_by: { type: string, enum: ['', MERCHANT, PLATFORM] }
        off_sale_reason: { type: string }
        off_sale_at: { type: string, format: date-time, nullable: true }
    MerchantProductDetail:
      allOf:
        - $ref: '#/components/schemas/MerchantProduct'
        - type: object
          properties:
            category_id: { type: integer, format: int64, nullable: true }
            category_name: { type: string }
            type_label: { type: string }
            images:
              type: array
              items: { type: string }
            description: { type: string }
            original_price: { type: integer }
            verify_days: { type: integer }
            appointment_required: { type: boolean }
            acceptance_required: { type: boolean, description: 是否需要商户接单（实物商品可配置） }
            valid_type: { type: string, enum: [DAYS, PERMANENT, RANGE] }
            valid_days: { type: integer, nullable: true }
            valid_from: { type: string, format: date-time, nullable: true }
            valid_to: { type: string, format: date-time, nullable: true }
            usable_weekdays:
              type: array
              items: { type: integer, minimum: 1, maximum: 7 }
            exclude_holidays: { type: boolean }
            verify_count: { type: integer }
            skus:
              type: array
              items: { $ref: '#/components/schemas/MerchantSku' }
            audited_at: { type: string, format: date-time, nullable: true }
            version: { type: integer, description: 编辑乐观锁版本 }
            created_at: { type: string, format: date-time }
    MerchantProductPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/MerchantProduct' }
                page: { $ref: '#/components/schemas/Page' }
    MerchantProductEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/MerchantProductDetail' }
    AdminProductDetail:
      allOf:
        - $ref: '#/components/schemas/MerchantProductDetail'
        - type: object
          properties:
            merchant_id: { type: integer, format: int64 }
            merchant_name: { type: string }
            merchant_no: { type: string }
    AdminProductDetailEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/AdminProductDetail' }
    MediaFolder:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        sort: { type: integer }
        asset_count: { type: integer }
        created_at: { type: string, format: date-time }
    MediaFolderInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 60 }
        sort: { type: integer }
    MediaAsset:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        original_name: { type: string }
        kind: { type: string, enum: [IMAGE, VIDEO] }
        url: { type: string, description: 素材访问地址，业务字段只能引用该地址 }
        mime: { type: string }
        size: { type: integer }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        duration_ms: { type: integer, nullable: true }
        folder: { type: integer, format: int64, nullable: true }
        folder_name: { type: string }
        created_by_name: { type: string }
        created_at: { type: string, format: date-time }
    MediaAssetUpload:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary }
        folder_id: { type: integer, format: int64, nullable: true }
        name: { type: string }
    MediaFolderListEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/MediaFolder' }
    MediaFolderEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/MediaFolder' }
    MediaAssetPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/MediaAsset' }
                page: { $ref: '#/components/schemas/Page' }
    MediaAssetEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/MediaAsset' }
    ProductTemplate:
      type: object
      properties:
        id: { type: integer, format: int64 }
        template_no: { type: string }
        title: { type: string }
        subtitle: { type: string }
        type: { type: string, enum: [PHYSICAL, SERVICE, COUPON] }
        category_id: { type: integer, format: int64 }
        category_name: { type: string }
        cover_url: { type: string }
        images:
          type: array
          items: { type: string }
        description: { type: string }
        price: { type: integer }
        original_price: { type: integer }
        verify_days: { type: integer }
        appointment_required: { type: boolean }
        delivery_types:
          type: array
          items: { type: string, enum: [EXPRESS, STORE_DELIVERY, PICKUP, VERIFY, APPOINTMENT] }
        skus:
          type: array
          items:
            type: object
            properties:
              sku_code: { type: string }
              spec: { type: object, additionalProperties: true }
              price_amount: { type: integer }
              stock: { type: integer }
        status: { type: string, enum: [DRAFT, PUBLISHED, OFFLINE] }
        scope: { type: string, enum: [NONE, ALL, SELECTED] }
        target_merchant_ids:
          type: array
          items: { type: integer, format: int64 }
        adoption_count: { type: integer }
        published_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    ProductTemplateInput:
      type: object
      required: [title, type, category_id, price_amount, delivery_types, skus]
      properties:
        title: { type: string }
        subtitle: { type: string }
        type: { type: string, enum: [PHYSICAL, SERVICE, COUPON] }
        category_id: { type: integer, format: int64 }
        cover_url: { type: string, description: 必须是素材库地址 }
        images:
          type: array
          items: { type: string }
        description: { type: string }
        price_amount: { type: integer, minimum: 1 }
        original_price_amount: { type: integer }
        verify_days: { type: integer }
        appointment_required: { type: boolean }
        acceptance_required: { type: boolean, default: true, description: 是否需要商户接单 }
        delivery_types:
          type: array
          items: { type: string, enum: [EXPRESS, STORE_DELIVERY, PICKUP, VERIFY, APPOINTMENT] }
        valid_type: { type: string, enum: [DAYS, PERMANENT, RANGE], default: DAYS }
        valid_days: { type: integer, nullable: true, description: valid_type=DAYS 时必填 }
        valid_from: { type: string, format: date-time, nullable: true, description: valid_type=RANGE 时必填 }
        valid_to: { type: string, format: date-time, nullable: true, description: valid_type=RANGE 时必填 }
        usable_weekdays:
          type: array
          description: 可用星期（1=周一，空=不限）
          items: { type: integer, minimum: 1, maximum: 7 }
        exclude_holidays: { type: boolean, default: false, description: 法定节假日不可用（文案提示） }
        verify_count: { type: integer, minimum: 1, maximum: 999, default: 1, description: 可核销次数 }
        skus:
          type: array
          items:
            type: object
            properties:
              sku_code: { type: string }
              spec: { type: object, additionalProperties: true }
              price_amount: { type: integer }
              stock: { type: integer }
        status: { type: string, enum: [DRAFT, PUBLISHED, OFFLINE] }
        scope: { type: string, enum: [NONE, ALL, SELECTED] }
        merchant_ids:
          type: array
          items: { type: integer, format: int64 }
    MerchantTemplate:
      allOf:
        - $ref: '#/components/schemas/ProductTemplate'
        - type: object
          properties:
            adopted_product_id: { type: integer, format: int64, nullable: true }
            adopted_status: { type: string }
    ProductTemplatePageEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/ProductTemplate' }
                page: { $ref: '#/components/schemas/Page' }
    ProductTemplateEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ProductTemplate' }
    MerchantTemplateListEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/MerchantTemplate' }
    AdminProduct:
      type: object
      properties:
        id: { type: integer, format: int64 }
        product_code: { type: string }
        title: { type: string }
        merchant_id: { type: integer, format: int64 }
        merchant_name: { type: string }
        category_id: { type: integer, format: int64, nullable: true }
        category_name: { type: string }
        type: { type: string }
        price: { type: integer }
        status: { type: string }
        sold_count: { type: integer }
        off_sale_by: { type: string }
        off_sale_reason: { type: string }
        updated_at: { type: string, format: date-time }
    AdminProductPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/AdminProduct' }
                page: { $ref: '#/components/schemas/Page' }
    AdminProductStatusInput:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [FORCE_OFF, RESTORE] }
        reason: { type: string, description: 强制下架必填 }
    AdminProductBatchStatusInput:
      type: object
      required: [ids, action]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: integer, format: int64 }
        action: { type: string, enum: [FORCE_OFF, RESTORE] }
        reason: { type: string, description: 批量强制下架必填 }
    BatchActionResultItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        ok: { type: boolean }
        status: { type: string, description: 成功时为处理后的状态 }
        off_sale_by: { type: string, description: 仅商品批量操作返回 }
        error_code: { type: string, description: 失败时的错误码 }
        error_message: { type: string, description: 失败原因 }
    BatchActionResult:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/BatchActionResultItem' }
        succeeded: { type: integer }
        failed: { type: integer }
    BatchActionResultEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/BatchActionResult' }

    ProductStatusInput:
      type: object
      required: [status]
