        amount: { type: integer }
        status: { type: string, enum: [PENDING, EVIDENCE, PROCESSING, DECIDED, CLOSED] }
        liability: { type: string, enum: [MERCHANT, USER, PLATFORM, SHARED, UNDECIDED] }
        ruling: { type: string }
        deadline_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    ArbitrationCasePageEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/ArbitrationCase' }
                page: { $ref: '#/components/schemas/Page' }
    ArbitrationDetail:
      allOf:
        - $ref: '#/components/schemas/ArbitrationCase'
        - type: object
          properties:
            decided_by_name: { type: string }
            after_sale:
              type: object
              additionalProperties: true
              description: 售后单信息、用户与商户、举证材料 evidence
    ArbitrationDetailEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ArbitrationDetail' }
    RuleVersionInput:
      type: object
      required: [snapshot]
      properties:
        snapshot: { type: object, additionalProperties: true }
        effective_at: { type: string, format: date-time }
        remark: { type: string }
    PayoutInput:
      type: object
      required: [voucher_no, voucher_url, paid_at]
      properties:
        voucher_no: { type: string }
        voucher_url: { type: string, format: uri }
        paid_at: { type: string, format: date-time }
    SettlementBatch:
      type: object
      properties:
        id: { type: integer, format: int64 }
        batch_no: { type: string }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        status: { type: string, enum: [PENDING, PUBLISHED, CLOSED] }
        total_amount: { type: integer }
        commission_amount: { type: integer }
        net_amount: { type: integer }
        items_count: { type: integer }
        published_at: { type: string, format: date-time }
    SettlementBatchPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/SettlementBatch' }
                page: { $ref: '#/components/schemas/Page' }
    SettlementBatchEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/SettlementBatch' }
    Reconciliation:
      type: object
      properties:
        date: { type: string, format: date }
        checks:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              status: { type: string, enum: [OK, DIFF, PENDING] }
              diff_count: { type: integer }
              diff_amount: { type: integer }
        unresolved_count: { type: integer }
    PaymentConfig:
      type: object
      properties:
        channel: { type: string, enum: [WECHAT_MINI, WECHAT_H5] }
        merchant_no: { type: string }
        app_id: { type: string }
        cert_serial_no: { type: string }
        notify_url: { type: string, format: uri }
        enabled: { type: boolean }
        updated_by_name: { type: string }
        updated_at: { type: string, format: date-time }
    PaymentConfigInput:
      type: object
      required: [merchant_no, api_v3_key, private_key, platform_cert]
      properties:
        merchant_no: { type: string }
        app_id: { type: string }
        api_v3_key: { type: string, description: 写入后仅返回脱敏标记 }
        cert_serial_no: { type: string }
        private_key: { type: string, description: PEM 文本 }
        platform_cert: { type: string, description: PEM 文本 }
        notify_url: { type: string, format: uri }
        enabled: { type: boolean }
    PaymentConfigEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/PaymentConfig' }
    OperationLog:
      type: object
      properties:
        id: { type: integer, format: int64 }
        operator_name: { type: string }
        action: { type: string }
        biz_type: { type: string }
        biz_id: { type: integer, format: int64 }
        reason: { type: string }
        created_at: { type: string, format: date-time }
    OperationLogPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/OperationLog' }
                page: { $ref: '#/components/schemas/Page' }
    CallbackAck:
      type: object
      properties:
        code: { type: string, enum: [SUCCESS, FAIL] }
        message: { type: string }
    Coupon:
      type: object
      properties:
        id: { type: integer, format: int64 }
        coupon_no: { type: string }
        name: { type: string }
        type: { type: string, enum: [PLATFORM, MERCHANT] }
        type_label: { type: string }
        merchant_id: { type: integer, format: int64, nullable: true }
        merchant_name: { type: string, nullable: true }
        face_value: { type: integer, description: 面额（分） }
        min_amount: { type: integer, description: 满减门槛（分，0=无门槛） }
        scope_type: { type: string, enum: [ALL, CATEGORY, PRODUCT] }
        scope_type_label: { type: string }
        scope_category_ids: { type: array, items: { type: integer } }
        scope_product_ids: { type: array, items: { type: integer } }
        total_stock: { type: integer }
        issued_count: { type: integer }
        remaining_stock: { type: integer, nullable: true }
        per_user_limit: { type: integer }
        valid_from: { type: string, format: date-time }
        valid_to: { type: string, format: date-time }
        status: { type: string, enum: [DRAFT, ACTIVE, PAUSED, EXPIRED] }
        status_label: { type: string }
        description: { type: string }
    UserCoupon:
      type: object
      properties:
        id: { type: integer, format: int64 }
        user_coupon_no: { type: string }
        coupon: { $ref: '#/components/schemas/Coupon' }
        status: { type: string, enum: [UNUSED, USED, EXPIRED] }
        status_label: { type: string }
        expire_at: { type: string, format: date-time, nullable: true }
        used_at: { type: string, format: date-time, nullable: true }
        order_no: { type: string }
    CouponCreateInput:
      type: object
      required: [name, face_value, valid_from, valid_to]
      properties:
        name: { type: string, maxLength: 60 }
        face_value: { type: integer, minimum: 1 }
        min_amount: { type: integer, minimum: 0, default: 0 }
        scope_type: { type: string, enum: [ALL, CATEGORY, PRODUCT], default: ALL }
        scope_category_ids: { type: array, items: { type: integer } }
        scope_product_ids: { type: array, items: { type: integer } }
        target_merchant_ids: { type: array, items: { type: integer } }
        total_stock: { type: integer, minimum: 0, default: 0 }
        per_user_limit: { type: integer, minimum: 0, default: 1 }
        valid_from: { type: string, format: date-time }
        valid_to: { type: string, format: date-time }
        description: { type: string, maxLength: 200 }
    PopupAd:
      type: object
      properties:
        id: { type: integer, format: int64 }
        title: { type: string, description: 内部管理标题 }
        image_url: { type: string, description: 弹窗图片 URL }
        link_url: { type: string, description: 关联跳转链接 }
        frequency: { type: string, enum: [EVERY_LAUNCH, ONCE_PER_DAY, ONCE_PER_WEEK, ONCE_PER_USER] }
        priority: { type: integer }
        start_at: { type: string, format: date-time, nullable: true }
        end_at: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [DRAFT, ENABLED, DISABLED, EXPIRED] }
        max_impressions: { type: integer, description: 总展示上限，0=不限 }
        impression_count: { type: integer, description: 已展示次数 }
        created_by_name: { type: string }
        created_at: { type: string, format: date-time }
    PopupAdPublic:
      type: object
      properties:
        id: { type: integer, format: int64 }
        image_url: { type: string }
        link_url: { type: string }
        frequency: { type: string, enum: [EVERY_LAUNCH, ONCE_PER_DAY, ONCE_PER_WEEK, ONCE_PER_USER] }
    PopupAdCreateInput:
      type: object
      required: [title, image_url]
      properties:
        title: { type: string, maxLength: 80 }
        image_url: { type: string, maxLength: 500 }
        link_url: { type: string, maxLength: 500 }
        frequency: { type: string, enum: [EVERY_LAUNCH, ONCE_PER_DAY, ONCE_PER_WEEK, ONCE_PER_USER], default: ONCE_PER_DAY }
        priority: { type: integer, default: 0 }
        start_at: { type: string, format: date-time, nullable: true }
        end_at: { type: string, format: date-time, nullable: true }
        max_impressions: { type: integer, minimum: 0, default: 0 }
    PopupAdEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/PopupAd' }
    PopupAdListEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/PopupAd' }
    PopupAdPublicEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/PopupAdPublic', nullable: true }
paths:
  /api/v1/health/:
    get:
      tags: [auth]
      operationId: health
      summary: 健康检查
      security: []
      x-status: implemented
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '503':
          description: 依赖不可用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /api/v1/accounts/auth/token/:
    post:
      tags: [auth]
      operationId: loginByPassword
      summary: 平台后台手机号密码登录
      security: []
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password]
              properties:
                phone: { type: string }
                password: { type: string }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/accounts/auth/refresh/:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: 刷新 Token
      security: []
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh]
              properties:
                refresh: { type: string }
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/wechat/login/:
    post:
      tags: [auth]
      operationId: loginByWechat
      summary: 小程序登录（code 换 openid/unionid）
      security: []
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WechatLoginInput' }
      responses:
        '200':
          description: 登录成功；按 unionid 合并账户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/auth/h5/sms/:
    post:
      tags: [auth]
      operationId: loginBySms
      summary: H5 手机号验证码登录
      security: []
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SmsLoginInput' }
      responses:
        '200':
          description: 登录成功；同手机号绑定 unionid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenEnvelope' }
        '429':
          description: 验证码发送/校验过于频繁
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/auth/sms/send/:
    post:
      tags: [auth]
      operationId: sendSmsCode
      summary: 发送短信验证码（服务商 TBD）
      security: []
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SmsSendInput' }
      responses:
        '200':
          description: 已发送
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SmsSendResultEnvelope' }
        '429':
          description: 触发限流
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /api/v1/accounts/me/:
    get:
      tags: [auth]
      operationId: getMe
      summary: 当前用户与商户角色
      x-status: implemented
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/addresses/:
    get:
      tags: [consumer]
      operationId: listAddresses
      summary: 收货地址列表
      x-status: implemented
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [consumer]
      operationId: createAddress
      summary: 新增收货地址
      x-status: implemented
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/addresses/{id}/:
    patch:
      tags: [consumer]
      operationId: updateAddress
      summary: 修改收货地址
      x-status: implemented
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [consumer]
      operationId: deleteAddress
      summary: 删除收货地址
      x-status: implemented
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: 已删除
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/stores/nearby/:
    get:
      tags: [consumer]
      operationId: listNearbyStores
      summary: 附近门店（按距离排序，只返回营业中）
      x-status: implemented
      security: []
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, format: double }
        - name: lng
          in: query
          required: true
          schema: { type: number, format: double }
        - name: radius
          in: query
          schema: { type: integer, default: 3000, description: 米 }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorePageEnvelope' }
  /api/v1/stores/{id}/:
    get:
      tags: [consumer]
      operationId: getStore
      summary: 门店详情与在售商品
      x-status: implemented
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoreEnvelope' }
        '404':
          description: 门店不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /api/v1/categories/:
    get:
      tags: [consumer]
      operationId: listCategories
      summary: 类目列表（仅启用）
      x-status: implemented
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryListEnvelope' }
  /api/v1/products/:
    get:
      tags: [consumer]
      operationId: listProducts
      summary: 商品列表（在售）
      x-status: implemented
      security: []
      parameters:
        - name: merchant
          in: query
          schema: { type: integer, format: int64 }
        - name: category
          in: query
          schema: { type: integer, format: int64 }
        - name: type
          in: query
          schema: { type: string, enum: [PHYSICAL, SERVICE, COUPON] }
        - name: search
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductPageEnvelope' }
  /api/v1/products/{id}/:
    get:
      tags: [consumer]
      operationId: getProduct
      summary: 商品/服务详情（有效期、退款规则、可约时段）
      x-status: implemented
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductEnvelope' }
        '404':
          description: 商品不存在或已下架
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /api/v1/cart/:
    get:
      tags: [cart]
      operationId: getCart
      summary: 当前用户的购物车（按商户分组）
      x-status: implemented
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/cart/items/:
    post:
      tags: [cart]
      operationId: addCartItem
      summary: 加入购物车（同商品同规格累加，支持跨商户）
      x-status: implemented
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartItemInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartEnvelope' }
        '409':
          description: 商品下架或库存不足
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/cart/items/{id}/:
    patch:
      tags: [cart]
      operationId: updateCartItem
      summary: 修改数量或选中状态
      x-status: implemented
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartItemPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 库存不足
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    delete:
      tags: [cart]
      operationId: deleteCartItem
      summary: 移出购物车
      x-status: implemented
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: 已删除
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/orders/:
    post:
      tags: [order]
      operationId: createOrder
      summary: 创建订单（服务端定价，预占库存/时段）
      x-status: implemented
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCreateInput' }
      responses:
        '201':
          description: 订单已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderEnvelope' }
        '409':
          description: STOCK_NOT_ENOUGH / SLOT_FULL / IDEMPOTENCY_CONFLICT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [order]
      operationId: listMyOrders
      summary: 我的订单
      x-status: implemented
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: merchant
          in: query
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderPageEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/orders/batch/:
    post:
      tags: [order]
      operationId: createBatchOrder
      summary: 批量下单（按商户拆分为多个订单，共享合单支付组）
      x-status: implemented
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
