  /api/v1/callback/wechat/refund/:
    post:
      tags: [callback]
      operationId: wechatRefundCallback
      summary: 微信退款回调（按 refund_no 幂等，资金冲回）
      description: 失败保留原因并告警，不能吞掉。
      x-status: planned
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: 微信退款 V3 加密回调原文
      responses:
        '200':
          description: 处理成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallbackAck' }
        '400':
          description: 验签失败或退款单不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
