components:
  schemas:
    Action3f4Enum:
      enum:
      - FORCE_OFF
      - RESTORE
      type: string
      description: |-
        * `FORCE_OFF` - FORCE_OFF
        * `RESTORE` - RESTORE
    AdminAdjustInputRequest:
      type: object
      properties:
        user_id:
          type: integer
          minimum: 1
        delta:
          type: integer
        reason:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - delta
      - reason
      - user_id
    AdminCategoryInputRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
        parent_id:
          type: integer
          nullable: true
        icon_url:
          type: string
          default: ''
          maxLength: 300
        sort:
          type: integer
          default: 0
        status:
          allOf:
          - $ref: '#/components/schemas/Status12eEnum'
          default: ENABLED
      required:
      - name
    AdminMerchantCreateInputRequest:
      type: object
      description: 平台创建商户：固定直接营业，必须绑定已有负责人。
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        short_name:
          type: string
          default: ''
          maxLength: 40
        category_id:
          type: integer
        industry:
          allOf:
          - $ref: '#/components/schemas/IndustryEnum'
          default: OTHER
        contact_phone:
          type: string
          minLength: 1
          maxLength: 20
        province:
          type: string
          default: ''
          maxLength: 32
        city:
          type: string
          minLength: 1
          maxLength: 32
        district:
          type: string
          minLength: 1
          maxLength: 32
        address:
          type: string
          minLength: 1
          maxLength: 200
        lng:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        lat:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        business_hours: {}
        commission_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,4})?$
          nullable: true
        settlement_cycle_days:
          type: integer
          maximum: 360
          minimum: 1
          default: 7
        delivery_fee:
          type: integer
          minimum: 0
          default: 0
        bank_info: {}
        qualifications:
          type: array
          items:
            $ref: '#/components/schemas/AdminMerchantQualificationInputRequest'
        owner_phone:
          type: string
          minLength: 1
          maxLength: 20
      required:
      - address
      - category_id
      - city
      - contact_phone
      - district
      - name
      - owner_phone
    AdminMerchantLocationInputRequest:
      type: object
      description: 平台设置商户真实坐标，统一使用高德 GCJ-02。
      properties:
        lng:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        lat:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        province:
          type: string
          default: ''
          maxLength: 32
        city:
          type: string
          default: ''
          maxLength: 32
        district:
          type: string
          default: ''
          maxLength: 32
        address:
          type: string
          default: ''
          maxLength: 200
      required:
      - lat
      - lng
    AdminMerchantQualificationInputRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/AdminMerchantQualificationInputTypeEnum'
        file_url:
          type: string
          minLength: 1
          maxLength: 300
        expire_at:
          type: string
          format: date
          nullable: true
      required:
      - file_url
      - type
    AdminMerchantQualificationInputTypeEnum:
      enum:
      - BUSINESS_LICENSE
      - FOOD_PERMIT
      - HEALTH_PERMIT
      - OTHER
      type: string
      description: |-
        * `BUSINESS_LICENSE` - 营业执照
        * `FOOD_PERMIT` - 食品经营许可
        * `HEALTH_PERMIT` - 卫生许可
        * `OTHER` - 其他
    AdminPlatformConfigInputRequest:
      type: object
      properties:
        platform_name:
          type: string
          minLength: 1
          maxLength: 80
        logo_url:
          type: string
          default: ''
          maxLength: 300
        contact_phone:
          type: string
          default: ''
          maxLength: 20
        company_name:
          type: string
          default: ''
          maxLength: 120
        icp_no:
          type: string
          default: ''
          maxLength: 80
        privacy_policy:
          type: string
          default: ''
        user_agreement:
          type: string
          default: ''
        agreement_version:
          type: string
          default: ''
          maxLength: 32
        miniapp_app_id:
          type: string
          default: ''
          maxLength: 64
        miniapp_app_secret:
          type: string
          default: ''
          maxLength: 128
        miniapp_original_id:
          type: string
          default: ''
          maxLength: 64
        amap_web_key:
          type: string
          default: ''
          maxLength: 128
        amap_js_key:
          type: string
          default: ''
          maxLength: 100
        amap_js_security_code:
          type: string
          default: ''
          maxLength: 128
        amap_enabled:
          type: boolean
          default: false
      required:
      - platform_name
    AdminProductBatchStatusInputRequest:
      type: object
      properties:
        ids:
          type: array
          items:
            type: integer
          maxItems: 100
          minItems: 1
        action:
          $ref: '#/components/schemas/Action3f4Enum'
        reason:
          type: string
          default: ''
          maxLength: 200
      required:
      - action
      - ids
    AdminProductStatusInputRequest:
      type: object
      properties:
        action:
