components:
  schemas:
    AdminCategoryInputRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
        parent_id:
          type: integer
          nullable: true
        icon_url:
          type: string
          default: ''
          maxLength: 300
        sort:
          type: integer
          default: 0
        status:
          allOf:
          - $ref: '#/components/schemas/Status12eEnum'
          default: ENABLED
      required:
      - name
    AdminMerchantCreateInputRequest:
      type: object
      description: 平台创建商户：固定直接营业，必须绑定已有负责人。
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        short_name:
          type: string
          default: ''
          maxLength: 40
        category_id:
          type: integer
        contact_phone:
          type: string
          minLength: 1
          maxLength: 20
        province:
          type: string
          default: ''
          maxLength: 32
        city:
          type: string
          minLength: 1
          maxLength: 32
        district:
          type: string
          minLength: 1
          maxLength: 32
        address:
          type: string
          minLength: 1
          maxLength: 200
        lng:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        lat:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        business_hours: {}
        commission_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,4})?$
          nullable: true
        settlement_cycle_days:
          type: integer
          maximum: 360
          minimum: 1
          default: 7
        bank_info: {}
        qualifications:
          type: array
          items:
            $ref: '#/components/schemas/AdminMerchantQualificationInputRequest'
        owner_phone:
          type: string
          minLength: 1
          maxLength: 20
      required:
      - address
      - category_id
      - city
      - contact_phone
      - district
      - name
      - owner_phone
    AdminMerchantQualificationInputRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/AdminMerchantQualificationInputTypeEnum'
        file_url:
          type: string
          minLength: 1
          maxLength: 300
        expire_at:
          type: string
          format: date
          nullable: true
      required:
      - file_url
      - type
    AdminMerchantQualificationInputTypeEnum:
      enum:
      - BUSINESS_LICENSE
      - FOOD_PERMIT
      - HEALTH_PERMIT
      - OTHER
      type: string
      description: |-
        * `BUSINESS_LICENSE` - 营业执照
        * `FOOD_PERMIT` - 食品经营许可
        * `HEALTH_PERMIT` - 卫生许可
        * `OTHER` - 其他
    AdminProductStatusInputActionEnum:
      enum:
      - FORCE_OFF
      - RESTORE
      type: string
      description: |-
        * `FORCE_OFF` - FORCE_OFF
        * `RESTORE` - RESTORE
    AdminProductStatusInputRequest:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/AdminProductStatusInputActionEnum'
        reason:
          type: string
          default: ''
          maxLength: 200
      required:
      - action
    AdminTemplateInputRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        subtitle:
          type: string
          default: ''
          maxLength: 200
        type:
          $ref: '#/components/schemas/ProductTypeEnum'
        category_id:
          type: integer
        cover_url:
          type: string
          default: ''
          maxLength: 300
        images:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 300
        description:
          type: string
          default: ''
        price_amount:
          type: integer
          minimum: 1
        original_price_amount:
          type: integer
          minimum: 0
          default: 0
        verify_days:
          type: integer
          maximum: 3650
          minimum: 1
          default: 30
        appointment_required:
          type: boolean
          default: false
        delivery_types:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryTypesEnum'
          minItems: 1
        skus:
          type: array
          items:
            $ref: '#/components/schemas/MerchantProductSkuInputRequest'
        status:
          allOf:
          - $ref: '#/components/schemas/AdminTemplateInputStatusEnum'
          default: DRAFT
        scope:
          allOf:
          - $ref: '#/components/schemas/ScopeEnum'
          default: NONE
        merchant_ids:
          type: array
          items:
            type: integer
      required:
      - category_id
      - delivery_types
      - price_amount
      - skus
      - title
      - type
    AdminTemplateInputStatusEnum:
      enum:
      - DRAFT
      - PUBLISHED
      - OFFLINE
      type: string
      description: |-
        * `DRAFT` - 草稿
        * `PUBLISHED` - 已发布
        * `OFFLINE` - 已下线
    AfterSaleDecisionDecisionEnum:
      enum:
      - AGREE
      - REJECT
      type: string
      description: |-
        * `AGREE` - AGREE
        * `REJECT` - REJECT
    AfterSaleDecisionRequest:
      type: object
      properties:
        decision:
          $ref: '#/components/schemas/AfterSaleDecisionDecisionEnum'
        approved_amount:
          type: integer
          minimum: 1
        reason:
          type: string
          default: ''
          maxLength: 200
      required:
      - decision
    AfterSaleInputRequest:
      type: object
      properties:
        order_id:
          type: integer
          minimum: 1
        order_item_id:
          type: integer
          nullable: true
        type:
          $ref: '#/components/schemas/AfterSaleInputTypeEnum'
        reason_code:
          type: string
          minLength: 1
          maxLength: 32
        description:
          type: string
          default: ''
          maxLength: 500
        evidence:
          type: array
          items:
            type: string
            format: uri
            minLength: 1
        request_amount:
          type: integer
          minimum: 1
      required:
      - order_id
      - reason_code
      - request_amount
      - type
    AfterSaleInputTypeEnum:
      enum:
      - REFUND_ONLY
      - RETURN_REFUND
      - SERVICE_ISSUE
      type: string
      description: |-
        * `REFUND_ONLY` - REFUND_ONLY
        * `RETURN_REFUND` - RETURN_REFUND
        * `SERVICE_ISSUE` - SERVICE_ISSUE
    AppUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        phone:
          type: string
          readOnly: true
          nullable: true
          title: 手机号
        nickname:
          type: string
          readOnly: true
          title: 昵称
        avatar_url:
          type: string
          format: uri
          readOnly: true
          title: 头像
        gender:
          allOf:
          - $ref: '#/components/schemas/GenderEnum'
          readOnly: true
          title: 性别
        status:
          allOf:
          - $ref: '#/components/schemas/AppUserStatusEnum'
          readOnly: true
          title: 状态
        identities:
          type: array
          items:
            $ref: '#/components/schemas/UserIdentity'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: 创建时间
      required:
      - avatar_url
      - created_at
      - gender
      - id
      - identities
      - nickname
      - phone
      - status
    AppUserStatusEnum:
      enum:
      - ACTIVE
      - DISABLED
      type: string
      description: |-
        * `ACTIVE` - 正常
        * `DISABLED` - 禁用
    Appointment:
      type: object
      properties:
        slot_id:
          type: integer
          nullable: true
          title: 时段
          readOnly: true
        slot_date:
          type: string
          format: date
          title: 预约日期
        start_time:
          type: string
          format: time
          title: 开始时间
        end_time:
          type: string
          format: time
          title: 结束时间
        status:
          allOf:
          - $ref: '#/components/schemas/AppointmentStatusEnum'
          title: 状态
        confirmed_at:
          type: string
          format: date-time
          nullable: true
          title: 确认时间
        remark:
          type: string
          title: 备注
          maxLength: 120
      required:
      - end_time
      - slot_date
      - slot_id
      - start_time
    AppointmentInputRequest:
      type: object
      properties:
        slot_id:
          type: integer
          minimum: 1
        remark:
          type: string
          default: ''
          maxLength: 120
      required:
      - slot_id
    AppointmentRequest:
      type: object
      properties:
        slot_date:
          type: string
          format: date
          title: 预约日期
        start_time:
          type: string
          format: time
          title: 开始时间
        end_time:
          type: string
          format: time
          title: 结束时间
        status:
          allOf:
          - $ref: '#/components/schemas/AppointmentStatusEnum'
          title: 状态
        confirmed_at:
          type: string
          format: date-time
          nullable: true
          title: 确认时间
        remark:
          type: string
          title: 备注
          maxLength: 120
      required:
      - end_time
      - slot_date
      - start_time
    AppointmentStatusEnum:
      enum:
      - PENDING_CONFIRM
      - CONFIRMED
      - COMPLETED
      - CANCELLED
      - NO_SHOW
      type: string
      description: |-
        * `PENDING_CONFIRM` - 待确认
        * `CONFIRMED` - 已确认
        * `COMPLETED` - 已完成
        * `CANCELLED` - 已取消
        * `NO_SHOW` - 爽约
    ArbitrationRuleInputRequest:
      type: object
      properties:
        ruling:
          type: string
          minLength: 1
          maxLength: 500
        liability:
          $ref: '#/components/schemas/LiabilityEnum'
        refund_amount:
          type: integer
          minimum: 0
          default: 0
      required:
      - liability
      - ruling
    AuditDecisionInputDecisionEnum:
      enum:
      - APPROVE
      - REJECT
      type: string
      description: |-
        * `APPROVE` - APPROVE
        * `REJECT` - REJECT
    AuditDecisionInputRequest:
      type: object
      properties:
        decision:
          $ref: '#/components/schemas/AuditDecisionInputDecisionEnum'
        reason:
          type: string
          default: ''
          maxLength: 200
      required:
      - decision
    CallbackAck:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
      - code
      - message
    CallbackPayloadRequest:
      type: object
      properties:
        payment_no:
          type: string
          minLength: 1
        transaction_id:
          type: string
          minLength: 1
        amount:
          type: integer
        trade_state:
          type: string
          minLength: 1
      required:
      - amount
      - payment_no
      - trade_state
      - transaction_id
    CancelInputRequest:
      type: object
      properties:
        reason:
          type: string
          default: ''
          maxLength: 200
    CartItemInputRequest:
      type: object
      properties:
        product_id:
          type: integer
          minimum: 1
        sku_id:
