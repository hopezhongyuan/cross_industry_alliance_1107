name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install --upgrade pip
          backend/.venv/bin/pip install -r backend/requirements-dev.txt
      - name: Verify
        run: make verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/admin-pc/package-lock.json
            frontend/miniapp/package-lock.json
      - name: Admin PC build
        working-directory: frontend/admin-pc
        run: |
          npm ci
          npm run gen:api
          npm run typecheck
          npm run build
      - name: Miniapp H5 build
        working-directory: frontend/miniapp
        run: |
          npm ci
          npm run typecheck
          npm run build:h5
